name: multiomics_robustness
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11.7
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.0
      - numpy==1.26.4
      - pandas==2.2.2
      - scipy==1.13.1
      - scikit-learn==1.5.2
      - matplotlib==3.8.4
      - anndata==0.11.4
      - scanpy==1.10.3
      - h5py==3.11.0
      - PyYAML==6.0.2
      - tqdm==4.66.5
      - mudata==0.3.10
      - scvi-tools==1.3.3
      - mofapy2==0.7.5
      - psutil
# Linux / WSL2 CUDA environment for the RTX 4060 server.
# Do not use the macOS environment.yml torch pin (MPS build).
# Recreate:
#   conda create -n multiomics_robustness python=3.11.7 pip -y
#   conda activate multiomics_robustness
#   pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cu126
#   pip install scvi-tools==1.3.3 scanpy==1.10.3 anndata==0.11.4 mofapy2==0.7.5
